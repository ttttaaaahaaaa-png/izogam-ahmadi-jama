    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.0.8/index.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1a237e; --secondary: #00bcd4; --accent: #ff9800;
            --success: #4caf50; --danger: #f44336; --dark: #212121; --light: #f5f5f5;
            --shadow: 0 10px 30px rgba(0,0,0,0.15); --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Vazirmatn', sans-serif; 
            background: #f8f9fa;
            background-image: 
                radial-gradient(at 40% 20%, rgba(0, 188, 212, 0.1) 0px, transparent 50%),
                radial-gradient(at 80% 0%, rgba(26, 35, 126, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, rgba(255, 152, 0, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Header */
        .header {
            position: fixed; top: 0; right: 0; left: 0;
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); 
            z-index: 1000; padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        
        .nav-container { 
            display: flex; justify-content: space-between; 
            align-items: center; 
        }
        
        /* Logo */
        .logo { 
            display: flex; align-items: center; gap: 12px; 
            text-decoration: none; 
        }
        .logo-icon {
            width: 55px; height: 55px; 
            background: var(--gradient);
            border-radius: 12px; display: flex; 
            align-items: center; justify-content: center;
            color: white; font-size: 1.8rem;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .logo-text h1 { font-size: 1.5rem; color: var(--primary); margin: 0; }
        .logo-text span { font-size: 0.9rem; color: var(--secondary); }
        
        /* Hamburger Menu */
        .hamburger-menu {
            display: none;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: var(--primary);
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: var(--transition);
        }
        .hamburger-menu:hover {
            background: rgba(26,35,126,0.05);
        }
        
        /* Main Menu */
        .nav-menu { 
            display: flex; list-style: none; gap: 5px; 
            background: rgba(255,255,255,0.9);
            padding: 8px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .nav-menu a { 
            text-decoration: none; color: var(--dark); 
            font-weight: 600; padding: 10px 20px; 
            border-radius: 10px; 
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-menu a:hover { 
            color: var(--primary); 
            background: rgba(26,35,126,0.1);
            transform: translateY(-2px);
        }
        .admin-menu-item {
            background: linear-gradient(45deg, var(--danger), #ff5252);
            color: white !important;
        }
        .admin-menu-item:hover {
            background: linear-gradient(45deg, #ff5252, var(--danger)) !important;
        }
        
        /* Header Actions */
        .header-actions { 
            display: flex; gap: 15px; 
            align-items: center; 
        }
        .cart-icon { 
            position: relative; cursor: pointer; 
            font-size: 1.3rem;
            background: white;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: var(--transition);
        }
        .cart-icon:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .cart-count {
            position: absolute; top: -8px; left: -8px; 
            background: linear-gradient(45deg, var(--danger), #ff5252);
            color: white; font-size: 0.8rem; 
            width: 22px; height: 22px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(244,67,54,0.3);
        }
        
        /* Buttons */
        .btn {
            padding: 12px 28px; border-radius: 15px; 
            text-decoration: none; font-weight: 600;
            border: none; cursor: pointer; 
            display: inline-flex; align-items: center;
            justify-content: center; gap: 10px; 
            transition: var(--transition);
            font-size: 1rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        .btn:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: 0.5s;
        }
        .btn:hover:before {
            left: 100%;
        }
        .btn-primary { 
            background: linear-gradient(45deg, var(--primary), var(--secondary)); 
            color: white; 
        }
        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(26,35,126,0.2);
        }
        .btn-secondary { 
            background: white; color: var(--primary); 
            border: 2px solid var(--primary); 
        }
        .btn-secondary:hover { 
            background: var(--primary); color: white;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(26,35,126,0.15);
        }
        .btn-success {
            background: linear-gradient(45deg, var(--success), #66bb6a);
            color: white;
        }
        .btn-danger {
            background: linear-gradient(45deg, var(--danger), #ff5252);
            color: white;
        }
        .btn-warning {
            background: linear-gradient(45deg, var(--accent), #ffb74d);
            color: white;
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 0.9rem;
        }
        
        /* User Menu */
        .user-menu-container { position: relative; }
        .user-dropdown {
            position: absolute; top: 120%; left: 0; 
            background: white; box-shadow: var(--shadow);
            border-radius: 15px; padding: 10px 0; 
            min-width: 220px; display: none; z-index: 1001;
            border: 1px solid #f0f0f0;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-dropdown a { 
            display: flex; align-items: center; gap: 10px;
            padding: 12px 20px; color: var(--dark); 
            text-decoration: none; 
            border-right: 3px solid transparent;
            transition: var(--transition);
        }
        .user-dropdown a:hover { 
            background: linear-gradient(to left, rgba(26,35,126,0.05), transparent);
            color: var(--primary); 
            border-right-color: var(--primary);
            padding-right: 25px;
        }
        .user-dropdown a.logout { color: var(--danger); }
        .user-dropdown a.logout:hover { 
            background: linear-gradient(to left, rgba(244,67,54,0.05), transparent);
            border-right-color: var(--danger);
        }
        .user-menu-container:hover .user-dropdown { display: block; }
        
        /* Hero */
        .hero {
            padding: 160px 0 120px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #1a237e 100%);
            color: white; text-align: center; margin-top: 80px;
            position: relative;
            overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%);
        }
        
        /* Products */
        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 35px; margin-top: 50px; padding: 60px 0;
        }
        .product-card {
            background: white; border-radius: 20px; 
            overflow: hidden; box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            border: 1px solid #f0f0f0;
        }
        .product-card:hover { 
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .product-image { 
            height: 220px; overflow: hidden; 
            position: relative;
        }
        .product-image img { 
            width: 100%; height: 100%; 
            object-fit: cover;
            transition: transform 0.8s ease;
        }
        .product-card:hover .product-image img {
            transform: scale(1.1);
        }
        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: linear-gradient(45deg, var(--accent), #ffb74d);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .product-content { padding: 25px; }
        .product-title { 
            font-size: 1.4rem; color: var(--primary); 
            margin-bottom: 10px; 
        }
        .product-price { 
            font-size: 2rem; color: var(--accent); 
            font-weight: 800; margin: 20px 0; 
        }
        
        /* Product Actions for Admin */
        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .product-actions .btn {
            flex: 1;
        }
        
        /* Modals */
        .modal {
            display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0;
            background: rgba(0,0,0,0.85); z-index: 1002; justify-content: center;
            align-items: center; padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white; border-radius: 25px; padding: 40px; 
            width: 100%; max-width: 500px; position: relative; 
            max-height: 90vh; overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            transform: scale(0.9);
            animation: modalAppear 0.4s ease forwards;
        }
        @keyframes modalAppear {
            to { transform: scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .modal-close:hover {
            background: #f5f5f5;
            color: var(--danger);
        }
        
        /* Admin Panel */
        .admin-panel {
            position: fixed;
            top: 0;
            right: -450px;
            width: 420px;
            background: white;
            height: 100vh;
            box-shadow: var(--shadow);
            z-index: 1003;
            transition: var(--transition);
            padding: 25px;
            overflow-y: auto;
        }
        .admin-panel.active {
            right: 0;
        }
        .admin-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 5px;
            border-radius: 15px;
        }
        .admin-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: var(--transition);
        }
        .admin-tab.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .admin-section {
            display: none;
        }
        .admin-section.active {
            display: block;
        }
        
        /* Tables */
        .table-responsive {
            overflow-x: auto;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .table th {
            background: linear-gradient(to left, #f8f9fa, white);
            color: var(--primary);
            font-weight: 700;
            padding: 15px;
            text-align: right;
            border-bottom: 2px solid #e0e0e0;
        }
        .table td {
            padding: 15px;
            text-align: right;
            border-bottom: 1px solid #e0e0e0;
        }
        .table tr:hover {
            background: rgba(0, 188, 212, 0.05);
        }
        .table-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
        }
        
        /* Forms */
        .form-group { margin-bottom: 25px; position: relative; }
        .form-group label { 
            display: block; margin-bottom: 10px; 
            color: var(--primary); font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-control { 
            width: 100%; padding: 15px; 
            border: 2px solid #e0e0e0; border-radius: 12px;
            font-size: 1rem;
            transition: var(--transition);
            background: #fafafa;
        }
        .form-control:focus { 
            outline: none; border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(0, 188, 212, 0.1);
            background: white;
        }
        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        /* Notification */
        .notification {
            position: fixed; top: 100px; right: 20px; 
            padding: 20px; background: white;
            border-radius: 15px; box-shadow: var(--shadow); 
            transform: translateX(150%); transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
            z-index: 10000; max-width: 400px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-right: 5px solid;
        }
        .notification.show { transform: translateX(0); }
        .notification.success { border-right-color: var(--success); }
        .notification.error { border-right-color: var(--danger); }
        .notification.warning { border-right-color: var(--accent); }
        
        /* Footer */
        .footer {
            background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
            color: white; padding: 70px 0 40px; margin-top: 80px;
            clip-path: polygon(0 10%, 100% 0, 100% 100%, 0 100%);
        }
        
        /* Responsive */
        @media (max-width: 992px) {
            .nav-menu {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: white;
                flex-direction: column;
                padding: 20px;
                border-radius: 20px;
                margin-top: 20px;
                box-shadow: var(--shadow);
                animation: slideDown 0.3s ease;
            }
            .nav-menu.active {
                display: flex;
            }
            .hamburger-menu {
                display: block;
            }
            .hero h1 {
                font-size: 2.5rem;
            }
            .admin-panel {
                width: 100%;
                right: -100%;
            }
            .product-actions {
                flex-direction: column;
            }
        }
        
        /* Utilities */
        .d-none { display: none !important; }
        .d-flex { display: flex !important; }
        .text-center { text-align: center; }
        .mb-3 { margin-bottom: 15px; }
        .mb-4 { margin-bottom: 20px; }
        .mb-5 { margin-bottom: 30px; }
        .mt-3 { margin-top: 15px; }
        .mt-4 { margin-top: 20px; }
        .mt-5 { margin-top: 30px; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 5px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--primary), var(--secondary)); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: linear-gradient(var(--secondary), var(--primary)); }
    </style>
</head>
